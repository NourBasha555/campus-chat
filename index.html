<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Arabic",sans-serif;background:#f6f3ec;color:#1b1b1b}
header{background:#1f6f5c;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:8px}
header h1{margin:0;font-size:20px}header button{min-height:36px;padding:0 12px;background:#ffffff33}
main{padding:12px;max-width:600px;margin:auto}
section{background:#fff;border-radius:14px;padding:12px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 8px}.note{color:#555;font-size:14px;margin:6px 0}
select,input[type=text],input[type=password]{width:100%;min-height:44px;padding:0 10px;font:inherit;border:1px solid #ccc;border-radius:10px;background:#fff}
button{min-height:44px;padding:0 16px;font:inherit;border:0;border-radius:10px;background:#1f6f5c;color:#fff;cursor:pointer}
button.ghost{background:#efe9dd;color:#1b1b1b}button.small{min-height:32px;padding:0 10px;font-size:13px}
button.danger{background:#b3261e}button:disabled{opacity:.45}
.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.room{min-height:56px;background:#efe9dd;color:#1b1b1b;font-weight:600}.room.general{grid-column:1/-1;background:#1f6f5c;color:#fff}
.room.locked{opacity:.4}
.list{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.msg{background:#efe9dd;border-radius:12px;padding:10px 12px}.mine{background:#d7ebe4}
.who{font-size:12px;opacity:.7;margin-bottom:2px}
.reply{font-size:12px;border-inline-start:3px solid #1f6f5c;padding:2px 8px;margin-bottom:4px;background:#0000000d;border-radius:4px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.score{font-weight:700;min-width:24px;text-align:center}
.form{display:flex;gap:8px}.form input{flex:1}
.warn{background:#fdecea;color:#8a1c12;border-radius:10px;padding:10px;margin-top:10px;display:none}
.banner{background:#fff3cd;border-radius:10px;padding:8px 10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.modbar{background:#1f1f1f;color:#fff;border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:14px}
.removed{background:#f3d9d6}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px}
.modal div{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:340px}
body.dark{background:#15181a;color:#e8e8e8}body.dark section{background:#1f2426}body.dark .msg{background:#2b3236}body.dark .mine{background:#1f4a3f}
body.dark select,body.dark input,body.dark textarea{background:#2b3236;color:#e8e8e8;border-color:#444}body.dark button.ghost,body.dark .room{background:#333b3f;color:#eee}body.dark .modal div{background:#1f2426;color:#eee}body.dark .note{color:#aaa}
.pinned{background:#fff3cd;color:#222;border-radius:10px;padding:8px;margin-bottom:8px;font-size:14px}
.poll{border:1px solid #8884;border-radius:12px;padding:8px;margin-bottom:8px}.opt{display:block;width:100%;position:relative;overflow:hidden;background:#8882;color:inherit;text-align:start;margin:4px 0;min-height:38px}.opt .bar{position:absolute;top:0;bottom:0;inset-inline-start:0;background:#1f6f5c55}.opt .ol{position:relative}.opt.sel{outline:2px solid #1f6f5c}
.chip{min-height:28px;padding:0 8px;font-size:14px;background:#8882;color:inherit;border-radius:14px}.chip.sel,.ghost.sel{outline:2px solid #1f6f5c}
.toast{position:fixed;top:8px;inset-inline:10px;background:#222;color:#fff;border-radius:10px;padding:10px;z-index:9;text-align:center}
.xo{display:grid;grid-template-columns:repeat(3,70px);gap:6px;justify-content:center}.cell{height:70px;font-size:30px;background:#8883;color:inherit;padding:0}
.tile{display:inline-block;border:2px solid #555;border-radius:6px;padding:6px 8px;margin:2px;background:#fff;color:#000;min-height:0;font-weight:700}.board{overflow-x:auto;white-space:nowrap;padding:6px 0}
.ban{background:#fdecea;color:#8a1c12;border-radius:10px;padding:10px;margin-bottom:8px}
textarea{border:1px solid #ccc;border-radius:10px;padding:8px}

<script>
// Bad-language filter (same as the first version). Loaded before app.js.
function norm(t){
  return t.toLowerCase()
   .replace(/[\u064B-\u065F\u0670\u0640]/g,'')
   .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
   .replace(/[\u06A9]/g,'ك').replace(/\u06CC/g,'ي').replace(/\u06AF/g,'ج').replace(/چ/g,'ج').replace(/ڤ/g,'ف').replace(/پ/g,'ب')
   .replace(/[٠-٩]/g,d=>String(d.charCodeAt(0)-0x660));
}
const AR_STRONG=['شرموط','عرص','متناك','منيوك','منيك','ينيك','انيك','نيكني','نيكمك','كسمك','كسام','كسختك','كساختك','كسخت','كسك','خولات','ابنالكلب','ولادالكلب','ابنالوسخ','ابنالمتناك','ابنالشرموط','ابنالقحب','قحبه','قحاب','عاهره','لبوه','ديوث','طيزك','طيزي','بزازك','بزازها','يلعنابوك','يلعندين','يلعنامك','دينامك','دينابوك','ابوكي','اتنيل','فشخ','فاشخ','سكس','زبي','زبك','ابنزنا','ولدزنا','وسخه','يابهيم','يابن','وسخ','زفت','زفتا','يالكلب','ياكلب','ياحمار','يافاشل','ياغبي','ياحيوان','يازبال','يامعرص','يامتناك','يابغل','يازفت','زباله','متخلف','متخلفه','حقير','حقيره','واطي','واطيه','قذر','قذره','غبي','غبيه','حمار','حمارك','كلب','كلبه','كلاب','بهيم','حيوان','حيوانه','تافه','سافل','سافله','خنزير','حثاله','عبيط','مجنون','كسم','كوسم','خرا','خره'];
// Short or ambiguous words: only match as whole word (with common prefixes)
const AR_WORD=['احا','كس','زب','خول','نيك','طيز','بز','بزاز','مص','خرا','خره','عير','ايري','ايرك','ديك','لوطي','شاذ','شاذه','عره','هبل','هبله'];
const AR_PREF=['','و','ف','ب','ل','يا','ال','وال','بال','لل','ي','ه','ح','هي','حي','ت','ن','ا'];
const LAT=['sharmoot','sharmot','sharmota','sharmoota','sharmouta','sharmoute','charmouta','3ars','a3rs','3rs','mtnak','mitnak','metnak','mitnaak','mtnaak','metnaak','manyak','manyok','manyouk','neek','nik','neeknak','aneek','aneekak','kosomak','ksomak','kosomk','kosom','kossomak','kos omak','ksmk','kosumak','kosummak','ks omak','kosomen','kosokhtak','kosokhtk','khawal','khawl','5awal','5wal','kahba','ka7ba','ka7ba','kahpa','sharmouta','3ahra','zebi','zeby','zobry','zobri','zoby','zebbi','zb','tizi','tezi','teezi','teezak','tezak','ebnelkalb','ebnelkelb','ibnelkalb','ebnelsharmota','ebnelmtnaka','ebnmtnaka','ebnelwes5a','ebnelwasekha','welad el kalb','weladelkalb','yalkalb','yakalb','yakelb','yahmar','ya7mar','7mar','3rs','a7a','a7eh','ayre','ayri','airy','ayrak','airak','ayry','ayree','ayreek','ayreeh','fuck','fck','fuk','fucc','fvck','shit','sh1t','bitch','b1tch','asshole','a55hole','pussy','bastard','whore','motherfucker','mtherfucker','nigga','nigger','idiot','stupid','dumb','moron','retard'];
const LAT_WORD=['3rs','neek','neik','cunt','slut','d1ck','a7a','7mar','zb','nik','kos','kos omak','tiz','tez','ars','3ars','aiyr','dick','fck','fuk'];
const LATMAP={'0':'o','1':'i','!':'i','$':'s','@':'a','5':'5','ph':'f'};
function squash(s){return s.replace(/(.)\1+/g,'$1');}
const sq=a=>a.map(w=>squash(norm(w).replace(/[^\p{L}\p{N}]/gu,'')));
const ARS=sq(AR_STRONG),LATS=sq(LAT);
function isBlocked(raw){
  const n=norm(raw);
  // keep letters/digits; spaces separate words
  const words=n.replace(/[^\p{L}\p{N}]+/gu,' ').trim().split(' ').filter(Boolean);
  const compactAr=squash(words.join(''));
  const arOnly=squash(n.replace(/[^\u0600-\u06FF]/gu,''));
  const joined=words.join('');
  // letters spaced out like "ك ل ب": join single-letter runs
  const merged=[];let run='';
  for(const w of words){ if([...w].length===1){run+=w;} else {if(run){merged.push(run);run='';} merged.push(w);} }
  if(run)merged.push(run);
  const toks=[...new Set([...words,...merged])];
  // strong Arabic substring on squashed arabic-only text
  if(ARS.some(w=>w.length>=3&&arOnly.includes(w)))return true;
  // whole-word short Arabic
  for(const t of toks){const s=squash(t);
    for(const w of AR_WORD){const ws=squash(w);for(const p of AR_PREF){if(s===squash(p)+ws)return true;}}
    // suffix possessives
    for(const w of ['كس','زب','طيز','خول','نيك','عير']){const ws=squash(w);for(const p of AR_PREF)for(const suf of ['ك','ها','ي','كم','هم','ات','ين']) if(!(w==='خول'&&suf==='ات'))if(s===squash(p)+ws+suf)return true;}
  }
  // two-word phrases: "كس امك", "ابن الكلب"
  const j2=squash(words.join(''));
  if(/كس?(ا)?م?ك|كساخت|كسام|كس.?ام/.test('')){}
  if(/(^|\s)(و|ي|يا)?كس\s*(ام|ا?م|اخت|اب|دين)/.test(n.replace(/[^\p{L}\p{N}]+/gu,' ')))return true;
  if(/دين\s*(ام|اب)/.test(n.replace(/[^\p{L}\p{N}]+/gu,' ')))return true;
  if(/ابن\s*(ال)?(كلب|وسخ|متناك|شرموط|قحب|حمار|زنا)|اب?ن\s*ال?(كلب|متناك)|ولاد\s*(ال)?(كلب|متناك|شرموط|قحب)|بنت\s*(ال)?(كلب|وسخ|متناك|شرموط|قحب)/.test(n.replace(/[^\p{L}\p{N}]+/gu,' ')))return true;

 else if(b.dataset.a==='pd'){try{await deleteDoc(doc(db,'rooms',S.room,'polls',p.id));}catch(x){toast(x.code);}}});

async function sendMsg(){const inp=$('text'),v=inp.value.trim();if(!v||!S.room)return;if(!inside()){toast(t('outside'));return;}if(banned()){renderGate();return;}
 if(isBlocked(v)){const w=$('warn');w.textContent=t('blocked');w.style.display='block';setTimeout(()=>w.style.display='none',3000);return;}
 inp.value='';const data={uid:S.user.uid,text:v.slice(0,500),ts:serverTimestamp(),replyTo:replyTo||'',votes:{},reports:{},reactions:{}};replyTo=null;$('replyBanner').classList.add('hidden');
 try{await addDoc(collection(db,'rooms',S.room,'messages'),data);}catch(e){toast(e.code==='permission-denied'?t('banned'):e.code);}}
$('send').onclick=sendMsg;$('text').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg();});
$('pollBtn').onclick=()=>{if(!inside()){toast(t('outside'));return;}showModal('<h2>'+t('poll')+'</h2><input id="pq" type="text" maxlength="150" placeholder="'+t('pollQ')+'"><p class="note">'+t('pollO')+'</p><textarea id="po" rows="5" style="width:100%;font:inherit"></textarea><div style="display:flex;gap:8px;margin-top:8px"><button id="pOk" type="button">'+t('create')+'</button><button id="pNo" class="ghost" type="button">'+t('cancel')+'</button></div>');
 $('pNo').onclick=hideModal;$('pOk').onclick=async()=>{const q=$('pq').value.trim(),o=$('po').value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,6);if(!q||o.length<2||isBlocked(q+' '+o.join(' ')))return;hideModal();
  try{await addDoc(collection(db,'rooms',S.room,'polls'),{uid:S.user.uid,q,opts:o,votes:{},ts:serverTimestamp()});}catch(e){toast(e.code);}};};
// ---------- games
const key=g=>g.id;
function renderGames(){if(!S.user)return;const gl=g=>(g.type==='xo'?'XO':'🁣 Domino');
 $('gOpen').innerHTML=S.openGames.map(g=>'<button class="small" data-j="'+g.id+'" type="button">'+t('join')+' '+gl(g)+'</button>').join(' ');
 $('gMine').innerHTML=S.games.filter(g=>g.status!=='gone').map(g=>'<button class="small ghost" data-o="'+g.id+'" type="button">'+t('resume')+' '+gl(g)+(g.status==='open'?' ⏳':g.status==='done'?' ✔':'')+'</button>').join(' ');
 renderGame();}
async function newGame(type){if(banned())return;const base={type,players:[S.user.uid],status:'open',ts:Date.now(),turn:0,winner:-2};
 if(type==='xo')base.board=Array(9).fill('');
 else{const all=[];for(let a=0;a<=6;a++)for(let b=a;b<=6;b++)all.push(a+'-'+b);for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]];}
  base.h0=all.slice(0,7);base.h1=all.slice(7,14);base.yard=all.slice(14);base.board=[];base.passes=0;}
 try{const r=await addDoc(collection(db,'games'),base);S.game=r.id;render();}catch(e){toast(e.code);}}
$('newXO').onclick=()=>newGame('xo');$('newDom').onclick=()=>newGame('dom');
$('gamesSec').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.o){S.game=b.dataset.o;render();}
 if(b.dataset.j){if(banned())return;try{await updateDoc(doc(db,'games',b.dataset.j),{players:arrayUnion(S.user.uid),status:'playing'});S.game=b.dataset.j;render();}catch(x){toast(x.code);}}});
$('gBack').onclick=()=>{S.game=null;render();};
$('gLeave').onclick=async()=>{const id=S.game;S.game=null;render();try{await deleteDoc(doc(db,'games',id));}catch(e){}};
function pips(h){return h.reduce((s,x)=>s+x.split('-').reduce((a,b)=>a+ +b,0),0);}
function renderGame(){if(!S.game)return;const g=S.games.find(x=>x.id===S.game);const el=$('gameBody');if(!g){return;}
 const me=g.players.indexOf(S.user.uid);let st='';
 if(g.status==='open')st=t('waiting');else if(g.status==='done')st=g.winner===-1?t('draw'):g.winner===me?t('youWin'):t('youLose');else st=g.turn===me?t('yourTurn'):t('theirTurn');
 let h='<p class="note"><b>'+st+'</b></p>';
 if(g.type==='xo'){h+='<div class="xo">'+g.board.map((c,i)=>'<button type="button" class="cell" data-c="'+i+'">'+(c==='X'?'✖':c==='O'?'⭕':'')+'</button>').join('')+'</div>';}
 else{const bd=g.board.map(x=>'<span class="tile">'+x.replace('-','|')+'</span>').join('');const hand=me===0?g.h0:g.h1,opp=me===0?g.h1:g.h0;
  h+='<div class="note">'+t('oppT')+opp.length+' · '+t('yard')+g.yard.length+'</div><div class="board">'+(bd||'—')+'</div><div class="acts">'+hand.map((x,i)=>'<button type="button" class="tile mine" data-d="'+i+'">'+x.replace('-','|')+'</button>').join('')+'</div>';
  if(g.status==='playing'&&g.turn===me){const can=hand.some(x=>fits(g,x));if(!can)h+=g.yard.length?'<button type="button" id="dDraw">'+t('drawTile')+'</button>':'<button type="button" id="dPass">'+t('pass')+'</button>';}}
 el.innerHTML=h;
 const d=$('dDraw');if(d)d.onclick=()=>domDraw(g,me);const p=$('dPass');if(p)p.onclick=()=>domPass(g,me);}
$('gameBody').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const g=S.games.find(x=>x.id===S.game);if(!g||g.status!=='playing')return;const me=g.players.indexOf(S.user.uid);if(g.turn!==me||banned())return;
 if(b.dataset.c!==undefined&&g.type==='xo'){const i=+b.dataset.c;if(g.board[i])return;const bd=[...g.board];bd[i]=me===0?'X':'O';
  const W=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];const win=W.some(w=>w.every(k=>bd[k]===bd[i]));const full=bd.every(Boolean);
  const u={board:bd,turn:1-me};if(win){u.status='done';u.winner=me;}else if(full){u.status='done';u.winner=-1;}try{await updateDoc(doc(db,'games',g.id),u);}catch(x){toast(x.code);}}
 if(b.dataset.d!==undefined&&g.type==='dom')domPlay(g,me,+b.dataset.d);});
function ends(g){if(!g.board.length)return null;return [+g.board[0].split('-')[0],+g.board[g.board.length-1].split('-')[1]];}
function fits(g,x){const e=ends(g);if(!e)return true;const [a,b]=x.split('-').map(Number);return a===e[0]||b===e[0]||a===e[1]||b===e[1];}
async function domPlay(g,me,i){const hk='h'+me,hand=[...g[hk]],x=hand[i];if(!fits(g,x))return;const [a,b]=x.split('-').map(Number);let bd=[...g.board];const e=ends(g);
 if(!e)bd=[x];else{const canL=a===e[0]||b===e[0],canR=a===e[1]||b===e[1];let side=canL&&canR?(confirm(t('left'))?'L':'R'):(canL?'L':'R');
  if(side==='L')bd.unshift(b===e[0]?a+'-'+b:b+'-'+a);else bd.push(a===e[1]?a+'-'+b:b+'-'+a);}
 hand.splice(i,1);const u={[hk]:hand,board:bd,turn:1-me,passes:0};if(!hand.length){u.status='done';u.winner=me;}
 try{await updateDoc(doc(db,'games',g.id),u);}catch(x){toast(x.code);}}
async function domDraw(g,me){const y=[...g.yard],hand=[...g['h'+me]];hand.push(y.pop());try{await updateDoc(doc(db,'games',g.id),{['h'+me]:hand,yard:y});}catch(x){toast(x.code);}}
async function domPass(g,me){const u={turn:1-me,passes:(g.passes||0)+1};if(u.passes>=2){const a=pips(g.h0),b=pips(g.h1);u.status='done';u.winner=a===b?-1:(a<b?0:1);}try{await updateDoc(doc(db,'games',g.id),u);}catch(x){toast(x.code);}}
// ---------- auth
function authErr(e){const c=e.code||'';if(c.includes('email-already'))return t('taken');if(c.includes('weak'))return t('weak');if(c.includes('credential')||c.includes('user-not-found')||c.includes('wrong-password'))return t('wrong');if(c.includes('network'))return t('neterr');return c||e.message;}
async function doAuth(mode){const u=$('aUser').value.trim(),p=$('aPass').value,er=$('aErr');er.textContent='';
 if(!/^[A-Za-z0-9_]{3,20}$/.test(u)){er.textContent=t('badUser');return;}
 try{if(mode==='signup'){if(isBlocked(u)){er.textContent=t('badName');return;}if(p.length<6){er.textContent=t('weak');return;}
   const c=await createUserWithEmailAndPassword(auth,u.toLowerCase()+DOM,p);try{await setDoc(doc(db,'users',c.user.uid),{username:u,created:Date.now()});}catch(e){}}
  else await signInWithEmailAndPassword(auth,u.toLowerCase()+DOM,p);}catch(e){er.textContent=authErr(e);}}
$('aLogin').onclick=()=>doAuth('login');$('aSign').onclick=()=>doAuth('signup');
$('logout').onclick=()=>signOut(auth);
$('aPass').addEventListener('keydown',e=>{if(e.key==='Enter')doAuth('login');});
onAuthStateChanged(auth,async u=>{offAll();off('me');curRoom=null;S.user=u;S.room=null;S.game=null;S.isMod=false;S.bannedUntil=0;S.uname='';
 if(u){try{const m=await getDoc(doc(db,'mods',u.uid));S.isMod=m.exists();}catch(e){}
  L.me=onSnapshot(doc(db,'users',u.uid),s=>{if(s.exists()){S.uname=s.data().username;S.bannedUntil=s.data().bannedUntil||0;}renderGate();},()=>{});
  L.cfg=onSnapshot(doc(db,'config','campus'),s=>{S.campus=CAMPUS_FIXED;sync();render();},()=>{});}
 sync();render();});

 showModal('<h2>'+t('code')+'</h2><p class="note">'+t('codeSet')+'</p><input id="cd" type="password" autocomplete="off"><p class="note" id="cdErr" style="color:#b3261e"></p><div style="display:flex;gap:8px"><button id="cdOk" type="button">'+t('ok')+'</button><button id="cdNo" class="ghost" type="button">'+t('cancel')+'</button></div>');

async function claim(code){const uid=S.user.uid,mref=doc(db,'mods',uid);
 try{await setDoc(mref,{code});return true;}catch(e){}
 try{await setDoc(doc(db,'secret','mod'),{hash:await sha(code)});}catch(e){}
