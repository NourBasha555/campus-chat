<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f6f5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Campus Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Arabic",sans-serif;background:#f6f3ec;color:#1b1b1b}
header{background:#1f6f5c;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:8px}
header h1{margin:0;font-size:20px}header button{min-height:36px;padding:0 12px;background:#ffffff33}
main{padding:12px;max-width:600px;margin:auto}
section{background:#fff;border-radius:14px;padding:12px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 8px}.note{color:#555;font-size:14px;margin:6px 0}
select,input[type=text],input[type=password]{width:100%;min-height:44px;padding:0 10px;font:inherit;border:1px solid #ccc;border-radius:10px;background:#fff}
button{min-height:44px;padding:0 16px;font:inherit;border:0;border-radius:10px;background:#1f6f5c;color:#fff;cursor:pointer}
button.ghost{background:#efe9dd;color:#1b1b1b}button.small{min-height:32px;padding:0 10px;font-size:13px}
button.danger{background:#b3261e}button:disabled{opacity:.45}
.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.room{min-height:56px;background:#efe9dd;color:#1b1b1b;font-weight:600}.room.general{grid-column:1/-1;background:#1f6f5c;color:#fff}
.room.locked{opacity:.4}
.list{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.msg{background:#efe9dd;border-radius:12px;padding:10px 12px}.mine{background:#d7ebe4}
.who{font-size:12px;opacity:.7;margin-bottom:2px}
.reply{font-size:12px;border-inline-start:3px solid #1f6f5c;padding:2px 8px;margin-bottom:4px;background:#0000000d;border-radius:4px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.score{font-weight:700;min-width:24px;text-align:center}
.form{display:flex;gap:8px}.form input{flex:1}
.warn{background:#fdecea;color:#8a1c12;border-radius:10px;padding:10px;margin-top:10px;display:none}
.banner{background:#fff3cd;border-radius:10px;padding:8px 10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.modbar{background:#1f1f1f;color:#fff;border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:14px}
.removed{background:#f3d9d6}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px}
.modal div{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:340px}
</style></head><body>
<header><div style="flex:1"><h1>Campus Chat</h1><div id="uni" style="font-size:13px;opacity:.9"></div></div><button id="mod" class="small" type="button"></button><button id="lang" class="small" type="button"></button></header>
<main>
<section id="locSec"><h2 id="tLoc"></h2><p class="note" id="tLocNote"></p><select id="loc"></select></section>
<section id="roomsSec"><h2 id="tRooms"></h2><div class="rooms" id="rooms"></div></section>
<section id="chatSec" class="hidden">
 <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><button id="back" class="ghost small" type="button"></button><h2 id="roomTitle" style="margin:0;flex:1"></h2></div>
 <div class="modbar hidden" id="modbar"></div>
 <div class="list" id="list"></div>
 <div class="banner hidden" id="replyBanner"><span id="replyTxt"></span><button id="cancelReply" class="ghost small" type="button">✕</button></div>
 <div class="form"><input id="text" type="text" maxlength="500" autocomplete="off"><button id="send" type="button"></button></div>
 <div class="warn" id="warn"></div>
 <div id="remSec" class="hidden"><h2 id="tRemoved" style="margin-top:14px"></h2><div class="list" id="remList"></div></div>
</section>
<p class="note" id="tDemo"></p>
</main>
<div class="modal hidden" id="modal"><div><h2 id="tPin"></h2><input id="pin" type="password" inputmode="numeric"><p class="note" id="pinErr" style="color:#b3261e"></p><div style="display:flex;gap:8px;margin-top:8px"><button id="pinOk" type="button"></button><button id="pinNo" class="ghost" type="button"></button></div></div></div>
<script>
// Bad-language filter (same as the first version). Loaded before app.js.
function norm(t){
  return t.toLowerCase()
   .replace(/[\u064B-\u065F\u0670\u0640]/g,'')
   .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
   .replace(/[\u06A9]/g,'ك').replace(/\u06CC/g,'ي').replace(/\u06AF/g,'ج').replace(/چ/g,'ج').replace(/ڤ/g,'ف').replace(/پ/g,'ب')
   .replace(/[٠-٩]/g,d=>String(d.charCodeAt(0)-0x660));
}
const AR_STRONG=['شرموط','عرص','متناك','منيوك','منيك','ينيك','انيك','نيكني','نيكمك','كسمك','كسام','كسختك','كساختك','كسخت','كسك','خولات','ابنالكلب','ولادالكلب','ابنالوسخ','ابنالمتناك','ابنالشرموط','ابنالقحب','قحبه','قحاب','عاهره','لبوه','ديوث','طيزك','طيزي','بزازك','بزازها','يلعنابوك','يلعندين','يلعنامك','دينامك','دينابوك','ابوكي','اتنيل','فشخ','فاشخ','سكس','زبي','زبك','ابنزنا','ولدزنا','وسخه','يابهيم','يابن','وسخ','زفت','زفتا','يالكلب','ياكلب','ياحمار','يافاشل','ياغبي','ياحيوان','يازبال','يامعرص','يامتناك','يابغل','يازفت','زباله','متخلف','متخلفه','حقير','حقيره','واطي','واطيه','قذر','قذره','غبي','غبيه','حمار','حمارك','كلب','كلبه','كلاب','بهيم','حيوان','حيوانه','تافه','سافل','سافله','خنزير','حثاله','عبيط','مجنون','كسم','كوسم','خرا','خره'];
// Short or ambiguous words: only match as whole word (with common prefixes)
const AR_WORD=['كس','زب','خول','نيك','طيز','بز','بزاز','مص','خرا','خره','عير','ايري','ايرك','ديك','لوطي','شاذ','شاذه','عره','هبل','هبله'];
const AR_PREF=['','و','ف','ب','ل','يا','ال','وال','بال','لل','ي','ه','ح','هي','حي','ت','ن','ا'];
const LAT=['sharmoot','sharmot','sharmota','sharmoota','sharmouta','sharmoute','charmouta','3ars','a3rs','3rs','mtnak','mitnak','metnak','mitnaak','mtnaak','metnaak','manyak','manyok','manyouk','neek','nik','neeknak','aneek','aneekak','kosomak','ksomak','kosomk','kosom','kossomak','kos omak','ksmk','kosumak','kosummak','ks omak','kosomen','kosokhtak','kosokhtk','khawal','khawl','5awal','5wal','kahba','ka7ba','ka7ba','kahpa','sharmouta','3ahra','zebi','zeby','zobry','zobri','zoby','zebbi','zb','tizi','tezi','teezi','teezak','tezak','ebnelkalb','ebnelkelb','ibnelkalb','ebnelsharmota','ebnelmtnaka','ebnmtnaka','ebnelwes5a','ebnelwasekha','welad el kalb','weladelkalb','yalkalb','yakalb','yakelb','yahmar','ya7mar','7mar','3rs','a7a','a7eh','ayre','ayri','airy','ayrak','airak','ayry','ayree','ayreek','ayreeh','fuck','fck','fuk','fucc','fvck','shit','sh1t','bitch','b1tch','asshole','a55hole','pussy','bastard','whore','motherfucker','mtherfucker','nigga','nigger','idiot','stupid','dumb','moron','retard'];
const LAT_WORD=['3rs','neek','neik','cunt','slut','d1ck','a7a','7mar','zb','nik','kos','kos omak','tiz','tez','ars','3ars','aiyr','dick','fck','fuk'];
const LATMAP={'0':'o','1':'i','!':'i','$':'s','@':'a','5':'5','ph':'f'};
function squash(s){return s.replace(/(.)\1+/g,'$1');}
const sq=a=>a.map(w=>squash(norm(w).replace(/[^\p{L}\p{N}]/gu,'')));
const ARS=sq(AR_STRONG),LATS=sq(LAT);
function isBlocked(raw){
  const n=norm(raw);
  // keep letters/digits; spaces separate words
  const words=n.replace(/[^\p{L}\p{N}]+/gu,' ').trim().split(' ').filter(Boolean);
  const compactAr=squash(words.join(''));
  const arOnly=squash(n.replace(/[^\u0600-\u06FF]/gu,''));
  const joined=words.join('');
  // letters spaced out like "ك ل ب": join single-letter runs
  const merged=[];let run='';
  for(const w of words){ if([...w].length===1){run+=w;} else {if(run){merged.push(run);run='';} merged.push(w);} }
  if(run)merged.push(run);
  const toks=[...new Set([...words,...merged])];
  // strong Arabic substring on squashed arabic-only text
  if(ARS.some(w=>w.length>=3&&arOnly.includes(w)))return true;
  // whole-word short Arabic
  for(const t of toks){const s=squash(t);
    for(const w of AR_WORD){const ws=squash(w);for(const p of AR_PREF){if(s===squash(p)+ws)return true;}}
    // suffix possessives
    for(const w of ['كس','زب','طيز','خول','نيك','عير']){const ws=squash(w);for(const p of AR_PREF)for(const suf of ['ك','ها','ي','كم','هم','ات','ين']) if(!(w==='خول'&&suf==='ات'))if(s===squash(p)+ws+suf)return true;}
  }
  // two-word phrases: "كس امك", "ابن الكلب"
  const j2=squash(words.join(''));
  if(/كس?(ا)?م?ك|كساخت|كسام|كس.?ام/.test('')){}
  if(/(^|\s)(و|ي|يا)?كس\s*(ام|ا?م|اخت|اب|دين)/.test(n.replace(/[^\p{L}\p{N}]+/gu,' ')))return true;
  if(/دين\s*(ام|اب)/.test(n.replace(/[^\p{L}\p{N}]+/gu,' ')))return true;
  if(/ابن\s*(ال)?(كلب|وسخ|متناك|شرموط|قحب|حمار|زنا)|اب?ن\s*ال?(كلب|متناك)|ولاد\s*(ال)?(كلب|متناك|شرموط|قحب)|بنت\s*(ال)?(كلب|وسخ|متناك|شرموط|قحب)/.test(n.replace(/[^\p{L}\p{N}]+/gu,' ')))return true;
  // Latin / Franco
  let l=n.replace(/[\u0600-\u06FF]/g,' ');
  const lw=l.replace(/[^a-z0-9$@!]+/g,' ').trim().split(' ').filter(Boolean).map(w=>w.replace(/[$]/g,'s').replace(/@/g,'a').replace(/!/g,'i'));
  const lm=[];let lr='';for(const w of lw){if(w.length===1)lr+=w;else{if(lr){lm.push(lr);lr='';}lm.push(w);}}if(lr)lm.push(lr);lw.push(...lm);const lj=squash(lw.join(''));
  const lj2=squash(lw.join('').replace(/0/g,'o').replace(/1/g,'i'));
  for(const w of LATS){ if(w.length>=4&&(lj.includes(w)||lj2.includes(w)))return true; }
  const lws=lw.map(squash);
  for(const w of LAT_WORD){const s=squash(w.replace(/[^a-z0-9]/g,''));if(lws.includes(s)||lws.includes(s+'s')||lws.includes(s+'ing')||lws.includes(s+'ed'))return true;}
  return false;
}




</script>
<script>
// CHANGE THE UNIVERSITY NAME HERE (one place only):
const UNIVERSITY={en:'Capital University',ar:'جامعة العاصمة'};
const MOD_PIN='1234'; // demo only. Real version uses a real login.
const REPORT_LIMIT=5, HALLS=18;
const T={ar:{
 loc:'مكانك (تجربة)',locNote:'في النسخة الحقيقية المكان بييجي من لوكيشن الموبايل. هنا اختار مكانك عشان تجرب.',
 rooms:'الغرف',general:'الغرفة العامة',hall:'مدرج ',lock:'🔒 لازم تكون قريب من المدرج',farMsg:'إنت بعيد عن الجامعة.',
 atHall:'عند مدرج ',campus:'في الجامعة (مش عند مدرج)',far:'بعيد عن الجامعة',
 back:'رجوع',ph:'اكتب رسالة...',send:'إرسال',blocked:'الرسالة دي اتمنعت: فيها ألفاظ مش مسموحة. اكتبها بشكل محترم.',
 reply:'رد',report:'إبلاغ',reported:'تم الإبلاغ',replyTo:'ردًا على: ',student:'طالب مجهول ',you:'إنت',
 empty:'مفيش رسائل لسه. ابدأ إنت.',mod:'مودريتور',modOut:'خروج المودريتور',modbar:'وضع المودريتور: تقدر تعدل وتمسح وتشوف المتمسح.',
 edit:'تعديل',del:'مسح',restore:'استرجاع',removed:'الرسائل المتمسحة (إنت بس اللي بتشوفها)',noRemoved:'مفيش رسائل متمسحة.',
 editPrompt:'عدّل الرسالة:',pin:'رقم المودريتور',pinNo:'إلغاء',pinOk:'دخول',pinBad:'الرقم غلط',
 demo:'ده نموذج على موبايلك بس: الرسائل مش بتتبعت لناس تانية لسه. رسالة "جرب الإبلاغ" في الغرفة العامة عليها 4 بلاغات، بلغ عنها وهي هتتمسح (5 بلاغات).',
 removedBy:'اتمسحت (5 بلاغات)',by:'مسحها المودريتور'},
 en:{
 loc:'Your location (demo)',locNote:'In the real version this comes from the phone GPS. Here, pick a place to try it.',
 rooms:'Rooms',general:'Campus-wide room',hall:'Hall ',lock:'🔒 You must be near this hall',farMsg:'You are far from campus.',
 atHall:'At Hall ',campus:'On campus (not at a hall)',far:'Far from campus',
 back:'Back',ph:'Write a message...',send:'Send',blocked:'This message was blocked: it has words that are not allowed. Please write it politely.',
 reply:'Reply',report:'Report',reported:'Reported',replyTo:'Replying to: ',student:'Student ',you:'You',
 empty:'No messages yet. Be the first.',mod:'Moderator',modOut:'Exit moderator',modbar:'Moderator mode: you can edit, delete and see deleted messages.',
 edit:'Edit',del:'Delete',restore:'Restore',removed:'Deleted messages (only you can see these)',noRemoved:'No deleted messages.',
 editPrompt:'Edit message:',pin:'Moderator PIN',pinNo:'Cancel',pinOk:'Enter',pinBad:'Wrong PIN',
 demo:'This is a demo on your phone only: messages are not sent to other people yet. The "try reporting" message in the General room already has 4 reports. Report it and it disappears (5 reports).',
 removedBy:'removed (5 reports)',by:'deleted by moderator'}};
const $=id=>document.getElementById(id);
const KEY='campus_chat_state_v2';
function seed(){
 const now=Date.now(),m={},r={};
 m.general=[
  {id:'s1',text:'Anyone know if tomorrow\'s exam is postponed?',anon:12,up:3,down:0,reports:0,replyTo:null,t:now-3600e3},
  {id:'s2',text:'حد عنده ملخص المحاضرة الأخيرة؟',anon:7,up:5,down:1,reports:0,replyTo:null,t:now-2400e3},
  {id:'s3',text:'جرب الإبلاغ: بلغ عن الرسالة دي',anon:31,up:0,down:2,reports:4,replyTo:null,t:now-1200e3}];
 m.hall7=[{id:'s4',text:'المحاضرة هتبدأ متأخر 10 دقايق',anon:44,up:2,down:0,reports:0,replyTo:null,t:now-900e3}];
 return {msgs:m,removed:r,votes:{},reported:{},lang:'ar',loc:'campus',mod:false,anon:100+Math.floor(Math.random()*900)};
}
let S;try{S=JSON.parse(localStorage.getItem(KEY))||seed();}catch(e){S=seed();}
S.mod=false;
function save(){localStorage.setItem(KEY,JSON.stringify(S));}
let room=null,replying=null;
const t=k=>T[S.lang][k];
const roomName=r=>r==='general'?t('general'):t('hall')+r.slice(4);
function allowed(r){
 if(S.loc==='far')return false;
 if(r==='general')return true;
 return S.loc==='hall'+r.slice(4);
}
function applyLang(){
 document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
 $('lang').textContent=S.lang==='ar'?'English':'العربية';
 $('tLoc').textContent=t('loc');$('tLocNote').textContent=t('locNote');$('tRooms').textContent=t('rooms');
 $('back').textContent=t('back');$('text').placeholder=t('ph');$('send').textContent=t('send');$('warn').textContent=t('blocked');
 $('tDemo').textContent=t('demo');$('tRemoved').textContent=t('removed');$('modbar').textContent=t('modbar');
 $('tPin').textContent=t('pin');$('pinOk').textContent=t('pinOk');$('pinNo').textContent=t('pinNo');
 $('uni').textContent=UNIVERSITY[S.lang];
 $('mod').textContent=S.mod?t('modOut'):t('mod');
 const sel=$('loc');sel.textContent='';
 const opts=[['far',t('far')],['campus',t('campus')]];
 for(let i=1;i<=HALLS;i++)opts.push(['hall'+i,t('atHall')+i]);
 opts.forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;sel.appendChild(o);});
 sel.value=S.loc;
}
function renderRooms(){
 const box=$('rooms');box.textContent='';
 const mk=r=>{const b=document.createElement('button');b.type='button';
  b.className='room'+(r==='general'?' general':'')+(allowed(r)?'':' locked');
  b.textContent=(allowed(r)?'':'🔒 ')+roomName(r);
  b.addEventListener('click',()=>{ if(!allowed(r)){alert(S.loc==='far'?t('farMsg'):t('lock'));return;} openRoom(r);});
  box.appendChild(b);};
 mk('general');for(let i=1;i<=HALLS;i++)mk('hall'+i);
}
function openRoom(r){room=r;replying=null;$('roomsSec').classList.add('hidden');$('locSec').classList.add('hidden');$('chatSec').classList.remove('hidden');renderChat();}
function closeRoom(){room=null;$('chatSec').classList.add('hidden');$('roomsSec').classList.remove('hidden');$('locSec').classList.remove('hidden');renderRooms();}
function sweepReports(){
 // messages with enough reports move to the removed list (only the moderator can see them)
 for(const r in S.msgs){S.msgs[r]=S.msgs[r].filter(m=>{
  if(m.reports>=REPORT_LIMIT){(S.removed[r]=S.removed[r]||[]).push(Object.assign({},m,{why:'reports'}));return false;}return true;});}
}
function btn(label,fn,cls){const b=document.createElement('button');b.type='button';b.className='small '+(cls||'ghost');b.textContent=label;b.addEventListener('click',fn);return b;}
function renderChat(){
 sweepReports();save();
 $('roomTitle').textContent=roomName(room);
 $('modbar').classList.toggle('hidden',!S.mod);$('remSec').classList.toggle('hidden',!S.mod);
 const l=$('list');l.textContent='';
 const arr=(S.msgs[room]||[]).slice().sort((a,b)=>a.t-b.t);
 if(!arr.length){const p=document.createElement('p');p.className='note';p.textContent=t('empty');l.appendChild(p);}
 arr.forEach(m=>{
  const d=document.createElement('div');d.className='msg'+(m.mine?' mine':'');
  const w=document.createElement('div');w.className='who';w.textContent=m.mine?t('you'):t('student')+m.anon;d.appendChild(w);
  if(m.replyTo){const q=document.createElement('div');q.className='reply';q.textContent=t('replyTo')+m.replyTo.text;d.appendChild(q);}
  const tx=document.createElement('div');tx.textContent=m.text;d.appendChild(tx);
  const a=document.createElement('div');a.className='acts';
  const v=S.votes[m.id];
  const up=btn('👍',()=>vote(m,1),v===1?'':'ghost'),dn=btn('👎',()=>vote(m,-1),v===-1?'':'ghost');
  if(v){up.disabled=dn.disabled=true;}
  const sc=document.createElement('span');sc.className='score';sc.textContent=m.up-m.down;
  a.append(up,sc,dn,btn(t('reply'),()=>{replying=m;showReply();$('text').focus();}));
  const rp=btn(S.reported[m.id]?t('reported'):t('report'),()=>report(m));if(S.reported[m.id])rp.disabled=true;a.appendChild(rp);
  if(S.mod){a.append(btn(t('edit'),()=>{const n=prompt(t('editPrompt'),m.text);if(n&&n.trim()){m.text=n.trim().slice(0,500);m.edited=true;save();renderChat();}}),
   btn(t('del'),()=>{S.msgs[room]=S.msgs[room].filter(x=>x.id!==m.id);(S.removed[room]=S.removed[room]||[]).push(Object.assign({},m,{why:'mod'}));save();renderChat();},'danger'));}
  d.appendChild(a);l.appendChild(d);
 });
 const rl=$('remList');rl.textContent='';
 if(S.mod){const rem=S.removed[room]||[];
  if(!rem.length){const p=document.createElement('p');p.className='note';p.textContent=t('noRemoved');rl.appendChild(p);}
  rem.forEach(m=>{const d=document.createElement('div');d.className='msg removed';
   const w=document.createElement('div');w.className='who';w.textContent=t('student')+m.anon+' · '+(m.why==='reports'?t('removedBy'):t('by'));
   const tx=document.createElement('div');tx.textContent=m.text;
   const a=document.createElement('div');a.className='acts';
   a.appendChild(btn(t('restore'),()=>{S.removed[room]=S.removed[room].filter(x=>x.id!==m.id);const c=Object.assign({},m);delete c.why;c.reports=0;(S.msgs[room]=S.msgs[room]||[]).push(c);save();renderChat();}));
   d.append(w,tx,a);rl.appendChild(d);});}
 showReply();
}
function showReply(){const b=$('replyBanner');if(replying){b.classList.remove('hidden');$('replyTxt').textContent=t('replyTo')+replying.text.slice(0,60);}else b.classList.add('hidden');}
function vote(m,v){if(S.votes[m.id])return;S.votes[m.id]=v;if(v===1)m.up++;else m.down++;save();renderChat();}
function report(m){if(S.reported[m.id])return;S.reported[m.id]=true;m.reports++;save();renderChat();}
function send(){
 const x=$('text').value.trim();if(!x)return;
 if(isBlocked(x)){$('warn').style.display='block';return;}
 $('warn').style.display='none';
 const m={id:'m'+Date.now()+Math.floor(Math.random()*1000),text:x,anon:S.anon,mine:true,up:0,down:0,reports:0,
  replyTo:replying?{id:replying.id,text:replying.text.slice(0,60)}:null,t:Date.now()};
 (S.msgs[room]=S.msgs[room]||[]).push(m);replying=null;$('text').value='';save();renderChat();
}
$('send').addEventListener('click',send);
$('text').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
$('back').addEventListener('click',closeRoom);
$('cancelReply').addEventListener('click',()=>{replying=null;showReply();});
$('loc').addEventListener('change',e=>{S.loc=e.target.value;save();if(room&&!allowed(room))closeRoom();else renderRooms();});
$('lang').addEventListener('click',()=>{S.lang=S.lang==='ar'?'en':'ar';save();applyLang();renderRooms();if(room)renderChat();});
$('mod').addEventListener('click',()=>{
 if(S.mod){S.mod=false;applyLang();if(room)renderChat();return;}
 $('pin').value='';$('pinErr').textContent='';$('modal').classList.remove('hidden');$('pin').focus();});
$('pinNo').addEventListener('click',()=>$('modal').classList.add('hidden'));
$('pinOk').addEventListener('click',()=>{
 if($('pin').value===MOD_PIN){S.mod=true;$('modal').classList.add('hidden');applyLang();if(room)renderChat();}
 else $('pinErr').textContent=t('pinBad');});
applyLang();renderRooms();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
