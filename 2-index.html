<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f6f5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Campus Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Arabic",sans-serif;background:#f6f3ec;color:#1b1b1b}
header{background:#1f6f5c;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:8px}
header h1{margin:0;font-size:20px}header button{min-height:36px;padding:0 12px;background:#ffffff33}
main{padding:12px;max-width:600px;margin:auto}
section{background:#fff;border-radius:14px;padding:12px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 8px}.note{color:#555;font-size:14px;margin:6px 0}
select,input[type=text],input[type=password]{width:100%;min-height:44px;padding:0 10px;font:inherit;border:1px solid #ccc;border-radius:10px;background:#fff}
button{min-height:44px;padding:0 16px;font:inherit;border:0;border-radius:10px;background:#1f6f5c;color:#fff;cursor:pointer}
button.ghost{background:#efe9dd;color:#1b1b1b}button.small{min-height:32px;padding:0 10px;font-size:13px}
button.danger{background:#b3261e}button:disabled{opacity:.45}
.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.room{min-height:56px;background:#efe9dd;color:#1b1b1b;font-weight:600}.room.general{grid-column:1/-1;background:#1f6f5c;color:#fff}
.room.locked{opacity:.4}
.list{display:flex;flex-direction:column;gap:10px;margin:8px 0}
.chead{display:flex;gap:8px;align-items:center;margin-bottom:8px;position:sticky;top:0;z-index:5;background:#fff;padding:6px 0}
body.dark .chead{background:#1f2426}
.msg .acts{opacity:.8}.msg .acts button{min-height:28px;padding:0 7px;font-size:12px}.msg .score{font-size:13px}
.form{position:sticky;bottom:0;z-index:5;background:#fff;padding:8px 0}
body.dark .form{background:#1f2426}
.form input{border-radius:999px}#send{border-radius:999px;min-width:56px}#emoBtn{border-radius:999px;min-width:44px;padding:0;font-size:20px}
#emoPanel{margin:6px 0}
.ecats{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.ecat{min-height:34px;padding:0 9px;background:#8882;color:inherit;border-radius:8px;font-size:17px}
.ecat.sel{outline:2px solid #1f6f5c}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:2px;max-height:230px;overflow-y:auto;background:#8881;border-radius:12px;padding:6px}
.em{min-height:42px;padding:0;background:transparent;color:inherit;font-size:23px;border-radius:8px}
.em:active{background:#8883}
.msg{max-width:85%;align-self:flex-start;background:#fff;border:1px solid #e6dfd0;border-radius:18px;border-start-start-radius:4px;padding:9px 13px;box-shadow:0 2px 6px #0002}.mine{background:linear-gradient(135deg,#1f6f5c,#2aa78d);color:#fff;border:0;align-self:flex-end;border-start-start-radius:18px;border-start-end-radius:4px}.mine .who{color:#d7fff2}.mine .reply{background:#ffffff22;border-color:#fff}
.who{font-size:12px;opacity:.7;margin-bottom:2px}
.reply{font-size:12px;border-inline-start:3px solid #1f6f5c;padding:2px 8px;margin-bottom:4px;background:#0000000d;border-radius:4px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.score{font-weight:700;min-width:24px;text-align:center}
.form{display:flex;gap:8px}.form input{flex:1}
.warn{background:#fdecea;color:#8a1c12;border-radius:10px;padding:10px;margin-top:10px;display:none}
.banner{background:#fff3cd;border-radius:10px;padding:8px 10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.modbar{background:#1f1f1f;color:#fff;border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:14px}
.removed{background:#f3d9d6}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px}
.modal div{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:340px}
.drawer{position:fixed;inset:0;background:#0006;z-index:8}
.dpanel{position:absolute;top:0;bottom:0;right:0;width:min(300px,85vw);background:#fff;padding:16px;box-shadow:-4px 0 16px #0003;overflow-y:auto;animation:slidein .22s ease-out}
@keyframes slidein{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}
body.dark .dpanel{background:#1f2426;color:#eee}
.dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.dpanel>button{display:block;width:100%;margin:8px 0}
body.dark{background:#15181a;color:#e8e8e8}body.dark section{background:#1f2426}body.dark .msg{background:#2b3236;border-color:#3a4247}body.dark .mine{background:linear-gradient(135deg,#1f6f5c,#2aa78d);color:#fff}
body.dark select,body.dark input,body.dark textarea{background:#2b3236;color:#e8e8e8;border-color:#444}body.dark button.ghost,body.dark .room{background:#333b3f;color:#eee}body.dark .modal div{background:#1f2426;color:#eee}body.dark .note{color:#aaa}
.pinned{background:#fff3cd;color:#222;border-radius:10px;padding:8px;margin-bottom:8px;font-size:14px}
.poll{border:1px solid #8884;border-radius:12px;padding:8px;margin-bottom:8px}.opt{display:block;width:100%;position:relative;overflow:hidden;background:#8882;color:inherit;text-align:start;margin:4px 0;min-height:38px}.opt .bar{position:absolute;top:0;bottom:0;inset-inline-start:0;background:#1f6f5c55}.opt .ol{position:relative}.opt.sel{outline:2px solid #1f6f5c}
.rcount{color:#b3261e;font-size:12px;font-weight:bold}
.bwrap{text-align:center}.btable{position:relative;width:100%;max-width:320px;aspect-ratio:1;margin:8px auto;border-radius:50%;background:#1f6f5c22}
.bseat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;font-size:22px;padding:4px 6px;border-radius:12px;background:#fff8;min-width:54px}.bseat small{font-size:11px}
.bturn{outline:2px solid #1f6f5c}.btarget{background:#ffd54f}
.bbottle{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;font-size:48px;line-height:60px;transition:transform 3.2s cubic-bezier(.15,.7,.2,1)}
.bq{background:#8881;border-radius:10px;padding:8px;margin:8px 0;text-align:start}.bq.last{opacity:.8}
.chip{min-height:28px;padding:0 8px;font-size:14px;background:#8882;color:inherit;border-radius:14px}.chip.sel,.ghost.sel{outline:2px solid #1f6f5c}
.toast{position:fixed;top:8px;inset-inline:10px;background:#222;color:#fff;border-radius:10px;padding:10px;z-index:9;text-align:center}
.xo{display:grid;grid-template-columns:repeat(3,86px);gap:9px;justify-content:center;direction:ltr;background:linear-gradient(160deg,#20755f,#134e40);padding:16px;border-radius:20px;box-shadow:inset 0 2px 12px #0006;margin:8px 0}.cell{height:86px;font-size:46px;font-weight:800;line-height:1;background:#fffdf6;color:#1b1b1b;padding:0;border-radius:16px;box-shadow:0 4px 8px #0004;transition:transform .1s,background .25s}.cell:active{transform:scale(.93)}.cell .m.x{color:#0e7c6b}.cell .m.o{color:#e2543e}.cell:active{transform:scale(.93)}.cell .m{display:inline-block}.cell .m.pn{animation:popin .18s ease-out}.cell .x{color:#12715e;font-weight:800}.cell .o{color:#e8590c;font-weight:800}.cell.win{background:#ffe066;outline:3px solid #fab005;animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}@keyframes popin{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}.gresult{text-align:center;margin:10px 0 4px;animation:popin .25s ease-out}.gresult .big{font-size:42px;margin-bottom:6px}.roundban{background:#fff3cd;color:#5c4a00;border-radius:10px;padding:8px 10px;margin:8px 0;text-align:center;font-weight:600;animation:popin .2s ease-out}body.dark .roundban{background:#4a3f12;color:#ffe9a8}.scorebar{direction:ltr;display:flex;gap:8px;justify-content:center;align-items:center;margin:2px 0 8px;flex-wrap:wrap}.spill{background:#1f6f5c;color:#fff;border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px}.spill.opp{background:#6c5840}.smeta{font-size:13px;color:#666}body.dark .smeta{color:#aaa}.ttimer{display:inline-block;background:#b3261e;color:#fff;border-radius:999px;padding:1px 10px;font-weight:700;font-size:13px;margin-inline-start:6px}
.tile{display:inline-block;border:2px solid #555;border-radius:6px;padding:6px 8px;margin:2px;background:#fff;color:#000;min-height:0;font-weight:700}.board{overflow-x:auto;white-space:nowrap;padding:6px 0}
.ban{background:#fdecea;color:#8a1c12;border-radius:10px;padding:10px;margin-bottom:8px}
textarea{border:1px solid #ccc;border-radius:10px;padding:8px}
.dt{display:inline-block;margin:2px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;transition:transform .12s;filter:drop-shadow(0 3px 4px #0006)}
@keyframes dplace{from{transform:translate(var(--dx,0),var(--dy,-40px)) rotate(100deg) scale(.9);opacity:.55}60%{opacity:1}to{transform:none;opacity:1}}
.dt.new{animation:dplace .38s cubic-bezier(.2,.8,.3,1);z-index:3}.dt svg{display:block}.dt.ok{filter:drop-shadow(0 0 7px #31d0a8)}.dt.sel{transform:translateY(-10px)}.dt.no{opacity:.5;cursor:default}.dt.back{cursor:default}
.dbd{direction:ltr;display:block;background:radial-gradient(ellipse at 50% 40%,#2a8a70,#134e40);border-radius:14px;padding:10px;min-height:52vh;margin:8px 0;box-shadow:inset 0 2px 10px #0005}.dcv{position:relative;margin:0 auto}.dcv .dt{position:absolute;margin:0;cursor:default}.dzbar{display:flex;gap:8px;margin-bottom:10px}.dzbar .zone{flex:1;min-height:46px;font-size:20px}.dbd>.zone{min-height:80px}.dhand{direction:ltr;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;padding:8px 0}.dopp{direction:ltr;display:flex;flex-wrap:wrap;justify-content:center}
.zone{border:2px dashed #9ee8d4;border-radius:10px;min-width:40px;min-height:46px;padding:2px 6px;display:flex;align-items:center;justify-content:center;color:#d7fff2;font-weight:700;font-size:14px}.zone.ok{background:#ffffff2e;border-style:solid}.zone.hot{background:#ffffff55;color:#fff}.dghost{position:fixed;pointer-events:none;z-index:50;opacity:.95}.pile{direction:ltr;display:flex;align-items:center;gap:8px;justify-content:center}
/* ---- visual polish ---- */
html{-webkit-text-size-adjust:100%}
body{line-height:1.5;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:20;min-height:60px;padding:8px 14px;background:linear-gradient(135deg,#1f6f5c,#175846);box-shadow:0 2px 10px #0003}
header h1{font-size:19px;line-height:1.2}
header button{min-width:42px;min-height:42px;padding:0;font-size:19px;border-radius:12px}
main{padding:12px 12px 28px}
section{border:1px solid #00000010;box-shadow:0 1px 2px #0000000d,0 6px 16px #0000000a}
h2{font-size:17px;font-weight:700;margin:0 0 10px}
button{font-weight:600;transition:transform .1s,filter .15s}
main button:not(.cell):active,.dpanel button:active{transform:scale(.97);filter:brightness(.95)}
input:focus,select:focus,textarea:focus{outline:2px solid #2aa78d;outline-offset:1px}
#authSec{padding:16px}#authSec button{flex:1}
.rooms{gap:10px}.room{min-height:58px;border-radius:14px;font-size:16px}.room.general{min-height:62px;font-size:18px}
#gamesSec>h2+.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}#gamesSec>h2+.acts button{width:100%;min-height:46px;font-size:13.5px;padding:0 6px;line-height:1.2;border-radius:12px}
#gOpen:empty,#gMine:empty{display:none}
#tDemo{text-align:center;font-size:12px;opacity:.65;margin:14px 10px 0}
#locSec{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px;padding:10px 12px;background:#fff8e1;border-color:#f0dc9a}
#locSec h2{display:none}#locSec .note{margin:0;font-size:13px;color:#6b5a1f}#locSec button{min-height:36px;white-space:nowrap}
.chead{top:60px;margin:0 0 8px;padding:8px 10px;border-radius:14px;box-shadow:0 1px 6px #0002;background:#fff}
#chatSec{background:transparent;box-shadow:none;border:0;padding:0;min-height:calc(100vh - 84px);min-height:calc(100dvh - 84px);display:flex;flex-direction:column}
#chatSec .list{flex:1;margin:4px 0 8px}
.form{margin-top:auto;padding:8px 0 10px;background:#f6f3ec;border-top:1px solid #0000000d}
.form input{min-height:46px;padding:0 16px}
#send{min-height:46px;min-width:64px}#emoBtn{min-height:46px;min-width:46px}
.msg{max-width:84%;font-size:16px;line-height:1.5;padding:10px 14px;box-shadow:0 1px 3px #00000026}
.msg .who{font-size:13px;font-weight:600}
.msg .acts{gap:6px;opacity:1}
.msg .acts button{min-height:30px;padding:0 9px;font-size:13px;border-radius:999px;background:#0000000d;color:inherit;font-weight:500}
.msg .acts button.danger{background:#b3261e1f;color:#b3261e}
.msg .acts button.sel{background:#1f6f5c33;outline:0}
.mine .acts button{background:#ffffff26;color:#fff}.mine .acts button.danger{background:#ffffff26;color:#ffd7d3}
.msg .score{font-size:14px;min-width:20px}
#emoPanel{margin:0 0 6px}
.ban{border:1px solid #b3261e44;border-inline-start:5px solid #b3261e;border-radius:12px;font-size:15px;line-height:1.7;padding:10px 14px}
.modbar{padding:10px 12px;line-height:1.7}
.banner,.pinned{border:1px solid #0000000f}
.drawer{backdrop-filter:blur(2px)}
.dpanel{padding:18px;border-start-start-radius:20px;border-end-start-radius:20px}
.dpanel>button{min-height:48px;border-radius:12px;margin:10px 0}
.dpanel select{border-radius:12px}
#gameSec{padding:12px}
.xo{box-shadow:inset 0 2px 12px #0006,0 4px 14px #0002}
.toast{box-shadow:0 6px 20px #0005;font-size:15px}
/* dark */
body.dark section{border-color:#ffffff12;box-shadow:0 1px 2px #0006}
body.dark header{background:linear-gradient(135deg,#1a5f4e,#134a3d)}
body.dark .room.general{background:#1f6f5c;color:#fff}
body.dark .chead{background:#1f2426}
body.dark #chatSec{background:transparent}
body.dark .form{background:#15181a;border-top-color:#ffffff12}
body.dark .msg .acts button{background:#ffffff14}
body.dark .msg .acts button.danger{background:#f2b8b524;color:#ffb4ab}
body.dark .mine .acts button{background:#ffffff26;color:#fff}body.dark .mine .acts button.danger{background:#ffffff26;color:#ffd7d3}
body.dark .ban,body.dark .warn{background:#3a1f1d;color:#ffb4ab;border-color:#ffb4ab44}
body.dark .banner,body.dark .pinned{background:#3a331a;color:#f1e3a6;border-color:#f1e3a622}
body.dark .roundban{background:#3a331a;color:#f1e3a6}
body.dark .removed{background:#3a2422}
body.dark #locSec{background:#2f2a16;border-color:#f1e3a633}body.dark #locSec .note{color:#e6d79a}
body.dark .note{color:#b4bcc0}
body.dark .modbar{background:#0d0f10;border:1px solid #ffffff14}
body.dark .cell{background:#ece6d6}
body.dark .dpanel{box-shadow:-4px 0 20px #000a}
body.dark .xo{box-shadow:inset 0 2px 12px #0008}

function isBlocked(raw){
  const n=norm(raw);
  // keep letters/digits; spaces separate words
  const words=n.replace(/[^\p{L}\p{N}]+/gu,' ').trim().split(' ').filter(Boolean);
  const compactAr=squash(words.join(''));
  const arOnly=squash(n.replace(/[^\u0600-\u06FF]/gu,''));
  const joined=words.join('');
  // letters spaced out like "ك ل ب": join single-letter runs
  const merged=[];let run='';
  for(const w of words){ if([...w].length===1){run+=w;} else {if(run){merged.push(run);run='';} merged.push(w);} }
  if(run)merged.push(run);
  const toks=[...new Set([...words,...merged])];
  // strong Arabic substring on squashed arabic-only text
  if(ARS.some(w=>w.length>=3&&arOnly.includes(w)))return true;

  for(const t of toks){const s=squash(t);
    for(const w of AR_WORD){const ws=squash(w);for(const p of AR_PREF){if(s===squash(p)+ws)return true;}}

    for(const w of ['كس','زب','طيز','خول','نيك','عير']){const ws=squash(w);for(const p of AR_PREF)for(const suf of ['ك','ها','ي','كم','هم','ات','ين']) if(!(w==='خول'&&suf==='ات'))if(s===squash(p)+ws+suf)return true;}
  }

  if(/دين\s*(ام|اب)/.test(n.replace(/[^\p{L}\p{N}]+/gu,' ')))return true;
  if(/ابن\s*(ال)?(كلب|وسخ|متناك|شرموط|قحب|حمار|زنا)|اب?ن\s*ال?(كلب|متناك)|ولاد\s*(ال)?(كلب|متناك|شرموط|قحب)|بنت\s*(ال)?(كلب|وسخ|متناك|شرموط|قحب)/.test(n.replace(/[^\p{L}\p{N}]+/gu,' ')))return true;
  // Latin / Franco
  let l=n.replace(/[\u0600-\u06FF]/g,' ');
  const lw=l.replace(/[^a-z0-9$@!]+/g,' ').trim().split(' ').filter(Boolean).map(w=>w.replace(/[$]/g,'s').replace(/@/g,'a').replace(/!/g,'i'));
  const lm=[];let lr='';for(const w of lw){if(w.length===1)lr+=w;else{if(lr){lm.push(lr);lr='';}lm.push(w);}}if(lr)lm.push(lr);lw.push(...lm);const lj=squash(lw.join(''));
  const lj2=squash(lw.join('').replace(/0/g,'o').replace(/1/g,'i'));
  for(const w of LATS){ if(w.length>=4&&(lj.includes(w)||lj2.includes(w)))return true; }

  return false;
}

function dist(a,b,c,d){const R=6371000,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p;const h=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h));}

 if(d)return d+t('dU')+' '+h+t('hU');if(h)return h+t('hU')+' '+m+t('mU');return Math.max(1,m)+t('mU');}

async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();}

// ---------- GPS
function startGps(){if(!navigator.geolocation){S.gpsErr=t('gpsNo');renderGate();return;}
 navigator.geolocation.watchPosition(p=>{S.gps={lat:p.coords.latitude,lon:p.coords.longitude};S.gpsErr='';sync();render();},e=>{S.gpsErr=e.code===1?t('gpsDeny'):t('gpsWait');renderGate();},{enableHighAccuracy:true,maximumAge:15000,timeout:30000});}

const L={};let attached=false;
function off(k){if(L[k]){L[k]();delete L[k];}}
function offAll(){Object.keys(L).forEach(off);attached=false;}
function sync(){touchIn();const want=!!S.user;if(want&&!attached)attach();else if(!want&&attached){offAll();S.room=null;S.game=null;S.msgs=[];}
 if(want)syncRoom();}
function attach(){attached=true;
 ROOMS.forEach(r=>{let first=true;L['n_'+r]=onSnapshot(query(collection(db,'rooms',r,'messages'),orderBy('ts','desc'),limit(1)),s=>{if(first){first=false;return;}s.docChanges().forEach(c=>{if(c.type==='added'&&!c.doc.metadata.hasPendingWrites){const m=c.doc.data();if(m.uid!==S.user.uid)notify(r,m);}});},()=>{});});
 L.games=onSnapshot(query(collection(db,'games'),where('players','array-contains',S.user.uid)),s=>{S.games=s.docs.map(d=>({id:d.id,...d.data()}));if(S.game){const g=curG();if(!g)S.game=null;}gamesWatch();render();},()=>{});
 L.open=onSnapshot(query(collection(db,'games'),where('status','==','open')),s=>{S.openGames=s.docs.map(d=>({id:d.id,...d.data()})).filter(g=>g.type!=='bottle'&&!g.players.includes(S.user.uid)&&Date.now()-(g.ts||0)<36e5);renderGames();},()=>{});}

 if(b.dataset.a==='again'){if(g.bot){newBotGame(g.type);return;}if((g.again||[]).includes(S.user.uid))return;try{await updateDoc(doc(db,'games',g.id),{again:arrayUnion(S.user.uid)});}catch(x){toast(x.code);}return;}
 if(g.status!=='playing'||g.turn!==me)return;
 if(b.dataset.c!==undefined&&g.type==='xo'){const i=+b.dataset.c;if(g.board[i])return;
  const u=xoMove(g,me,i);try{await gupd(g,u);}catch(x){toast(x.code);}}});
const XOW=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function xoMove(g,me,i){const bd=[...g.board];bd[i]=me===0?'X':'O';const win=XOW.some(w=>w.every(k=>bd[k]===bd[i]));const u={board:bd,turn:1-me,turnTs:Date.now()};if(win){u.status='done';u.winner=me;u.doneTs=Date.now();}else if(bd.every(Boolean)){u.status='done';u.winner=-1;u.doneTs=Date.now();}return u;}
function xoBotPick(bd,mark,opp){const em=[];bd.forEach((c,i)=>{if(!c)em.push(i);});if(!em.length)return -1;
 const tryM=m=>em.find(i=>XOW.some(w=>w.includes(i)&&w.every(k=>k===i?true:bd[k]===m)));
 let r=tryM(mark);if(r===undefined)r=tryM(opp);if(r!==undefined)return r;
 if(!bd[4])return 4;const cs=[0,2,6,8].filter(i=>!bd[i]);if(cs.length)return cs[Math.floor(Math.random()*cs.length)];return em[Math.floor(Math.random()*em.length)];}
// domino bot: returns {i,side} | 'draw' | 'pass'
function domBotPick(g,me){const hand=g['h'+me];let best=-1,bs=-1;hand.forEach((x,i)=>{if(fits(g,x)){const p=x.split('-').reduce((a,b)=>a+ +b,0);if(p>bs){bs=p;best=i;}}});
 if(best>=0){const sd=domSides(g,hand[best]);return {i:best,side:sd.includes('R')?'R':sd[0]};}
 return g.yard.length?'draw':'pass';}
function botKick(g){if(!g.bot||g.status!=='playing'||g.turn!==1)return;clearTimeout(botKick.t);botKick.t=setTimeout(()=>{if(S.bot!==g||g.status!=='playing'||g.turn!==1)return;botStep(g);},800);}
function autoKick(g){if(g.type!=='xo'||g.status!=='done'||g.winner!==-1)return;const k=(g.bot?'bot':g.id)+':'+(g.doneTs||0);if(autoKick.k===k)return;autoKick.k=k;
 setTimeout(()=>{const c=g.bot?S.bot:S.games.find(x=>x.id===g.id);if(!c||c.status!=='done'||c.winner!==-1||c.doneTs!==g.doneTs)return;gupd(c,{board:Array(9).fill(''),status:'playing',turn:0,winner:-2,round:(c.round||1)+1,doneTs:0,turnTs:Date.now()}).catch(()=>{});},1400);}
function timeoutKick(g){if(timeoutKick.g)return;timeoutKick.g=true;setTimeout(()=>timeoutKick.g=false,4000);
 const slow=g.turn,u={status:'done',winner:1-slow,timeout:slow,doneTs:Date.now(),again:[]};
 if(g.bot){if(slow===0){S.bot=null;S.game=null;render();toast(t('youTimeout'));}else{Object.assign(g,u);renderGame();}return;}
 updateDoc(doc(db,'games',g.id),u).catch(()=>{});}
setInterval(()=>{if(S.user)updateBanBar();const g=S.game?curG():null;if(!g||g.status!=='playing'||g.type==='bottle')return;const lim=g.type==='xo'?10000:40000;
 const left=lim-(Date.now()-(g.turnTs||g.ts||Date.now()));const el=$('turnTimer');if(el)el.textContent='⏱ '+Math.max(0,Math.ceil(left/1000));
 if(left<=0){const me=g.players.indexOf(S.user.uid);if(g.bot){if(g.turn===0)timeoutKick(g);}else if(g.turn!==me)timeoutKick(g);}},1000);
function gamesWatch(){if(!S.user)return;if(!S._leftSeen)S._leftSeen=new Set();const me=S.user.uid;
 S.games.forEach(g=>{
  if(g.status==='left'&&g.leftBy!==undefined&&g.players[g.leftBy]!==me){if(S._leftSeen.has(g.id))return;S._leftSeen.add(g.id);const wasViewing=S.game===g.id;if(wasViewing)S.game=null;if(wasViewing||Date.now()-(g.leftTs||0)<6e5)toast(t('oppLeft'));deleteDoc(doc(db,'games',g.id)).catch(()=>{});render();return;}
  if(g.status==='done'&&g.timeout!==undefined&&g.players[g.timeout]===me){if(S._leftSeen.has('to'+g.id))return;S._leftSeen.add('to'+g.id);if(S.game===g.id){S.game=null;render();}toast(t('youTimeout'));return;}
  if(g.status==='done'&&(g.again||[]).length>=2&&g.players[0]===me){gupd(g,rematchUpdate(g)).catch(()=>{});return;}
  if(g.type==='xo'&&g.status==='done'&&g.winner===-1&&g.players[0]===me)autoKick(g);});}
function botStep(g){if(g.type==='xo'){const i=xoBotPick(g.board,'O','X');if(i>=0)gupd(g,xoMove(g,1,i));return;}
 const d=domBotPick(g,1);if(d==='draw'){const y=[...g.yard],h=[...g.h1];h.push(y.pop());gupd(g,{h1:h,yard:y});}else if(d==='pass')domPass(g,1);else{const u=domMove(g,1,d.i,d.side);if(u)gupd(g,u);}}
function newBotGame(type){const base={bot:true,id:'bot',type,players:[S.user.uid,'bot'],status:'playing',ts:Date.now(),turn:0,winner:-2,score0:0,score1:0,round:1,again:[],doneTs:0,lastRound:null,turnTs:Date.now()};
 if(type==='xo')base.board=Array(9).fill('');else Object.assign(base,deal());
 S.bot=base;S.game='bot';S.dpick=null;render();}
$('botXO').onclick=()=>newBotGame('xo');$('botDom').onclick=()=>newBotGame('dom');
function ends(g){if(!g.board.length)return null;return [+g.board[0].split('-')[0],+g.board[g.board.length-1].split('-')[1]];}
function fits(g,x){const e=ends(g);if(!e)return true;const [a,b]=x.split('-').map(Number);return a===e[0]||b===e[0]||a===e[1]||b===e[1];}
function domSides(g,x){const e=ends(g);if(!e)return['R'];const [a,b]=x.split('-').map(Number);const r=[];if(a===e[0]||b===e[0])r.push('L');if(a===e[1]||b===e[1])r.push('R');return r;}
function domMove(g,me,i,side){const hk='h'+me,hand=[...g[hk]],x=hand[i];if(x===undefined||!domSides(g,x).includes(side))return null;const [a,b]=x.split('-').map(Number);let bd=[...g.board];const e=ends(g);
 if(!e)bd=[x];else if(side==='L')bd.unshift(b===e[0]?a+'-'+b:b+'-'+a);else bd.push(a===e[1]?a+'-'+b:b+'-'+a);
 hand.splice(i,1);if(!hand.length)return scoreRound(g,me,{[hk]:hand,board:bd});
 return {[hk]:hand,board:bd,turn:1-me,passes:0,turnTs:Date.now()};}
async function domPlay(g,me,i,side){S.dpick=null;const _tel=document.querySelector('#gameBody .dhand [data-d="'+i+'"]');if(_tel)S._lastPlay={side,rect:_tel.getBoundingClientRect(),ts:Date.now()};const u=domMove(g,me,i,side);if(!u){renderGame();return;}try{await gupd(g,u);}catch(x){toast(x.code);}}
function domTile(a,b,vert,cls,back,idx,hs,sty){const HS=40,K=(hs||40)/40,W=vert?HS:HS*2,H=vert?HS*2:HS;const P={1:[[1,1]],2:[[0,0],[2,2]],3:[[0,0],[1,1],[2,2]],4:[[0,0],[2,0],[0,2],[2,2]],5:[[0,0],[2,0],[1,1],[0,2],[2,2]],6:[[0,0],[2,0],[0,1],[2,1],[0,2],[2,2]]};
 let c='<rect x="1.5" y="1.5" width="'+(W-3)+'" height="'+(H-3)+'" rx="8" fill="'+(back?'#1d6b58':'#fffdf6')+'" stroke="'+(back?'#0e3a30':'#4a3f2f')+'" stroke-width="2"/>';
 if(!back){c+=vert?'<line x1="6" y1="40" x2="34" y2="40" stroke="#4a3f2f" stroke-width="2"/>':'<line x1="40" y1="6" x2="40" y2="34" stroke="#4a3f2f" stroke-width="2"/>';
  [a,b].forEach((v,k)=>{(P[v]||[]).forEach(p=>{const cx=(vert?0:k*HS)+8+p[0]*12,cy=(vert?k*HS:0)+8+p[1]*12;c+='<circle cx="'+cx+'" cy="'+cy+'" r="5" fill="#16181b"/>';});
   c+='<text x="'+((vert?0:k*HS)+33)+'" y="'+((vert?k*HS:0)+11)+'" font-size="9.5" font-weight="700" fill="#9c8a60" text-anchor="middle" font-family="sans-serif">'+v+'</text>';});}
 else c+='<circle cx="'+(W/2)+'" cy="'+(H/2)+'" r="7" fill="none" stroke="#ffffff77" stroke-width="2.5"/>';
 return '<div class="dt '+cls+'"'+(idx!==undefined?' data-d="'+idx+'"':'')+(sty?' style="'+sty+'"':'')+'><svg width="'+Math.round(W*K)+'" height="'+Math.round(H*K)+'" viewBox="0 0 '+W+' '+H+'">'+c+'</svg></div>';}
function domLayout(board,T,W){const gp=Math.max(3,Math.round(T*.12)),P=2*T+gp,out=[];let dir=1,cx=0,cy=T,rowN=0,aft=false;
 board.forEach(x=>{const [a,b]=x.split('-').map(Number),dbl=a===b&&!aft,wide=dbl?T:2*T;
  const fit=rowN===0||(dir>0?cx+wide<=W-T:cx-wide>=T);
  if(!fit){const px=dir>0?cx:cx-T;out.push({x:px,y:cy-T/2,w:T,h:2*T,a,b,v:1});cx=dir>0?px+T:px;dir=-dir;cy+=P;rowN=0;aft=true;return;}
  if(dbl){const px=dir>0?cx:cx-T;out.push({x:px,y:cy-T,w:T,h:2*T,a,b,v:1});cx+=dir*T;}
  else{const px=dir>0?cx:cx-2*T;out.push({x:px,y:cy-T/2,w:2*T,h:T,a:dir>0?a:b,b:dir>0?b:a,v:0});cx+=dir*2*T;}
  rowN++;aft=false;});
 let mn=1e9,mx=-1e9,my=0;out.forEach(o=>{mn=Math.min(mn,o.x);mx=Math.max(mx,o.x+o.w);my=Math.max(my,o.y+o.h);});
 if(!out.length){mn=0;mx=0;}const off=Math.round((W-(mx-mn))/2-mn);out.forEach(o=>{o.x+=off;});return {tiles:out,h:Math.ceil(my+T/2)};}
let dDrag=null;
document.addEventListener('pointerdown',e=>{const el=e.target.closest&&e.target.closest('#gameBody .dhand [data-d]');if(!el||!S.game)return;const g=curG();if(!g||g.status!=='playing')return;const me=g.players.indexOf(S.user.uid);if(g.turn!==me)return;const i=+el.dataset.d,x=g['h'+me][i];if(x===undefined||!fits(g,x))return;dDrag={i,x0:e.clientX,y0:e.clientY,moved:false,ghost:null,el};});
document.addEventListener('pointermove',e=>{if(!dDrag)return;const d=dDrag;if(!d.moved&&Math.hypot(e.clientX-d.x0,e.clientY-d.y0)>8){d.moved=true;d.ghost=d.el.cloneNode(true);d.ghost.classList.add('dghost');d.ghost.classList.remove('sel');document.body.appendChild(d.ghost);}
 if(d.ghost){d.ghost.style.left=(e.clientX-32)+'px';d.ghost.style.top=(e.clientY-16)+'px';document.querySelectorAll('#dBoard .zone').forEach(z=>z.classList.remove('hot'));const z=document.elementFromPoint(e.clientX,e.clientY);const zz=z&&z.closest&&z.closest('#dBoard .zone');if(zz)zz.classList.add('hot');e.preventDefault();}});
function dEnd(e,cancel){if(!dDrag)return;const d=dDrag;dDrag=null;if(d.ghost)d.ghost.remove();const g=curG();if(!g||cancel){renderGame();return;}const me=g.players.indexOf(S.user.uid);const x=g['h'+me][d.i];if(x===undefined)return;const sides=domSides(g,x);
 if(d.moved){const z=document.elementFromPoint(e.clientX,e.clientY);const zz=z&&z.closest&&z.closest('#dBoard .zone');const bdEl=z&&z.closest&&z.closest('#dBoard');let side=zz?zz.dataset.side:(bdEl&&!ends(g)?'R':null);if(side&&sides.includes(side))domPlay(g,me,d.i,side);else renderGame();}
 else{if(sides.length===1)domPlay(g,me,d.i,sides[0]);else{S.dpick=S.dpick===d.i?null:d.i;renderGame();}}}
document.addEventListener('pointerup',e=>dEnd(e,false));document.addEventListener('pointercancel',e=>dEnd(e,true));
document.addEventListener('click',e=>{const z=e.target.closest&&e.target.closest('#dBoard .zone');if(!z||!z.classList.contains('ok'))return;const g=curG();if(!g||g.status!=='playing')return;const me=g.players.indexOf(S.user.uid);if(g.turn!==me)return;if(S.dpick===null||S.dpick===undefined)return;domPlay(g,me,S.dpick,z.dataset.side);});
async function domDraw(g,me){const y=[...g.yard],hand=[...g['h'+me]];hand.push(y.pop());try{await gupd(g,{['h'+me]:hand,yard:y});}catch(x){toast(x.code);}}
async function domPass(g,me){if((g.passes||0)+1>=2){const a=pips(g.h0),b=pips(g.h1);const w=a===b?-1:(a<b?0:1);try{await gupd(g,scoreRound(g,w));}catch(x){toast(x.code);}return;}try{await gupd(g,{turn:1-me,passes:(g.passes||0)+1,turnTs:Date.now()});}catch(x){toast(x.code);}}

function authErr(e){const c=e.code||'';if(c.includes('email-already'))return t('taken');if(c.includes('weak'))return t('weak');if(c.includes('credential')||c.includes('user-not-found')||c.includes('wrong-password'))return t('wrong');if(c.includes('network'))return t('neterr');return c||e.message;}
async function doAuth(mode){const u=$('aUser').value.trim(),p=$('aPass').value,er=$('aErr');er.textContent='';
 if(!/^[A-Za-z0-9_]{3,20}$/.test(u)){er.textContent=t('badUser');return;}
 try{if(mode==='signup'){if(isBlocked(u)){er.textContent=t('badName');return;}if(p.length<6){er.textContent=t('weak');return;}
   const c=await createUserWithEmailAndPassword(auth,u.toLowerCase()+DOM,p);try{await setDoc(doc(db,'users',c.user.uid),{username:u,created:Date.now()});}catch(e){}}
  else await signInWithEmailAndPassword(auth,u.toLowerCase()+DOM,p);}catch(e){er.textContent=authErr(e);}}
